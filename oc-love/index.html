ter;color:var(--ink);line-height:1.7;min-height:72px}.option:hover{background:white;border-color:#9d727e}.option[aria-pressed=true]{border-color:var(--wine);background:#eadbe0}.letter{font:italic 21px Georgia,serif;width:25px;flex-shrink:0;color:var(--wine)}.qbottom{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:28px}.qbottom .quiet{margin:0}.result{max-width:960px;margin:auto}.result-intro{margin-bottom:27px}.result-intro h2{font-size:25px}.result-grid{display:grid;grid-template-columns:285px 1fr;border:1px solid var(--line);background:#fffaf2}.identity{background:#461526;color:#f3e8da;padding:35px 27px;display:flex;flex-direction:column}.identity .meta{color:#caaaaf}.monogram{font:90px/1.3 var(--serif);margin:32px 0 12px;color:#e7c9bc}.identity h2{font:500 35px/1.3 var(--serif);margin:15px 0}.identity .role{font-size:14px;color:#dac2c5;line-height:1.9}.type{border-top:1px solid #ffffff30;margin-top:28px;padding-top:22px;font:21px/1.6 var(--serif)}.identity .identity-foot{font:italic 13px Georgia,serif;color:#caaaaf;margin-top:auto;padding-top:40px}.result-content{padding:32px 34px}.result-content h3{font:600 21px var(--serif);margin:0 0 12px}.result-content p{margin:0;line-height:1.95}.result-section{padding:22px 0;border-bottom:1px solid var(--line)}.result-section:first-child{padding-top:0}.result-section:last-child{border:0}.danger h3{color:#912f43}.danger{background:#8b2f4307;margin:0 -15px;padding:22px 15px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);padding:5px 10px;font-size:13px}.reasons{margin:0;padding-left:20px;font-size:15px;line-height:1.95}.linequote{font:23px/1.8 var(--serif)!important;color:var(--wine)}.quote-note{font-size:12px;color:var(--muted);margin-top:8px!important}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.secondary{border:1px solid var(--line);background:transparent;padding:15px 22px;color:var(--ink)}.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:25px}.atlas button{background:#fffcf6;border:1px solid var(--line);padding:24px;text-align:left;color:var(--ink)}.atlas h3{font:26px var(--serif);margin:13px 0 7px}.atlas p{font-size:14px;color:var(--muted);margin:0}.atlas button:hover{border-color:var(--wine)}.notice{border-left:2px solid var(--wine);padding-left:15px;font-size:14px;color:var(--muted);margin:20px 0}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.export-preview{width:100%;max-width:440px;display:block;margin:20px 0;border:1px solid var(--line)}@media(max-width:850px){header{padding:20px 23px}.home{gap:35px;grid-template-columns:1fr}.book{min-height:480px;margin:10px 10px 20px 0}.home h1{font-size:57px}.book h2{font-size:30px}main{padding:34px 23px 45px}.home .lede{max-width:none}.result-grid{grid-template-columns:1fr}.identity{padding:26px;position:relative}.monogram{display:none}.identity h2{font-size:38px}.type{margin-top:17px;padding-top:15px}.identity .identity-foot{display:none}.result-content{padding:26px}.atlas{grid-template-columns:repeat(2,1fr)}footer{padding:20px 23px}.qbottom{align-items:stretch;flex-direction:column}.qbottom .primary{width:100%}.option{padding:16px;gap:13px}.actions>*{flex:1}.meta{letter-spacing:1px}.hide-mobile{display:none}}@media(max-width:440px){.atlas{grid-template-columns:1fr}.brand{font-size:18px;letter-spacing:2px}.home h1{font-size:50px}.result-content{padding:23px}.book{padding:29px 27px}.bookhead{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{header,footer,.actions,.result-intro,.notice{display:none}.result-grid{display:block}.identity{background:white;color:black}.identity .role,.identity .meta{color:black}main{padding:0}.result-section{break-inside:avoid}}
</style></head><body><header><div class="brand"><i>♡</i>恋人未署名</div><span class="meta">THE UNWRITTEN LOVER</span></header><main id="app"></main><footer><span>原创角色恋爱测试 · 全性别玩家友好</span><span class="hide-mobile">17 个名字，17 种爱的方式。</span></footer><script>
const app=document.getElementById('app');function home(){app.innerHTML=`<section class="home"><div><div class="eyebrow">一份尚未署名的恋人档案</div><h1>谁会成为<br>你的<em>完美恋人？</em></h1><p class="lede">你会为怎样的人心动，又愿意和怎样的人生活？<br>把答案留在这里，遇见 17 位 OC 中的一个。<br>先读他的好，再看爱的另一面。</p><button class="primary start" onclick="start()">打开我的恋爱档案 <span>↗</span></button><p class="quiet">16 次选择 · 约 4 分钟 · 全部角色均为成年版本<br>娱乐向匹配；结果不代表现实中的理想伴侣。</p></div><aside class="book"><div class="bookhead"><span>LOVE, IN SEVENTEEN WAYS</span><span>VOL. 01</span></div><div><div class="ornament">&</div><h2>心动有迹可循，<br>爱却各有缺口。</h2><p class="subtitle">Between affection and its shadow.</p></div><div><div class="specimen">有人把爱说成一句玩笑。<span>言语 / 亲密 / 未说出口的愿望</span></div><div class="specimen">有人把爱放进明天的安排。<span>陪伴 / 承担 / 共同生活</span></div><div class="bookfoot"><span>吸引力与危险，写在同一页。</span><span>01—17</span></div></div></aside></section>`}const dims=['主动靠近','表达方式','日常照顾','彼此空间','情绪浓度','审美共鸣','事业投入','幽默方式','靠近节奏','脆弱表达','陪伴频率','外在气质'];
const people=[
{id:'shao',name:'邵敬美',age:'31 岁',job:'旧时文人 · 出版与收藏',type:'风流知己',tags:['风雅','慷慨','不专属的温柔'],good:'慷慨体贴、风雅会爱，能与你共享文学与生活的情趣。',risk:'温柔不专属，关系不顺时容易转向下一个人。',day:'一起读书、谈艺术，他愿意为你的兴致花钱，也能在你难过时留意到细小的变化。日常喜欢被顺着，大事却愿意与你商量。',need:'他看重文学共鸣，也希望恋人听得懂含蓄的情绪；体贴是真实的，稳定专一却不是他的保证。',quote:'陪你把这页读完，别的事一会儿再说。',scene:'一起谈书到午后，对方懂情趣、出手大方；相聚很动人，却不保证一生只对你温柔。',v:[3,3,2,3,1,3,1,2,3,0,0,3],fidelity:'open',control:0},
{id:'lv',name:'吕羡明',age:'37 岁',job:'香港商人',type:'强占旧情',tags:['行动派','记得过去','强烈占有'],good:'行动力强，记得细小往事，也能为你提供切实的帮助。',risk:'把恩情变成占有的凭据，明确拒绝也不能让他停下。',day:'他会替你安排机会、教你应对外界，也记得久远的小事。但他的帮助常带着介入你生活的要求，情意与自私始终并存。',need:'他最在意的是你留下，并承认共同的过去。对方拒绝后仍不停止属于强迫与伤害，不是亲密偏好的证明。',quote:'你还记得那时候吗？我一直都记得。',scene:'有人能替你铺路，也将旧事牢牢记在心；这是一段会用恩情索取、可能无视拒绝的危险虚构关系。',v:[3,3,3,0,2,0,3,2,3,1,1,2],fidelity:'open',control:3,extreme:true},
{id:'pei',name:'裴琏',age:'29 岁',job:'电影创作者 · 离异育有一女',type:'热烈依恋',tags:['浪漫行动派','孩子气','渴望互相依靠'],good:'热烈浪漫，愿意带你走进自己的世界，也渴望成为你的依靠。',risk:'越在乎越幼稚，容易用嫉妒和无理取闹索取特殊地位。',day:'他会带你去片场看自己的镜头，兴致勃勃地分享发现，也会在亲近后撒娇、嘴硬。出身普通，有事业与承担能力，不能只当成需要哄的小孩。',need:'他需要你明确选择他，也希望你接受他的照顾。事业带来分别，育有一女也是需要认真面对的生活条件。',quote:'你知道我需要你，也要相信你可以需要我。',scene:'陪对方去看正在拍的镜头，听他兴奋地讲计划；他会撒娇，也认真想让你依靠他。',v:[3,2,2,1,3,3,3,2,2,3,2,2],fidelity:'exclusive',control:1,child:true},
{id:'liu',name:'柳骞人',age:'28 岁',job:'职业网球运动员',type:'自厌深情',tags:['克制','长久信任','别扭的柔软'],good:'克制重情，珍惜长久的信任，别扭时也会主动给你台阶。',risk:'自我否定根深蒂固，你的爱与肯定可能始终难以被他相信。',day:'他对外成熟有分寸，亲近后会流露柔软，争执时也舍得别别扭扭地递台阶。成绩来自长期苦功，输赢却都可能被他用来否定自己。',need:'具体、持续的信任比空洞赞美更能抵达他。恋人可以陪伴，但不承担治好他的自恨的任务。',quote:'你说的话，我记着。',scene:'与安静克制的人慢慢建立信任；他对自己苛刻，却会在别扭以后主动给你台阶。',v:[1,0,2,2,1,1,3,0,0,1,1,1],fidelity:'exclusive',control:0},
{id:'hezhong',name:'何重俭',age:'43 岁',job:'公司高层 · 职业经理人',type:'回避照料',tags:['现实照顾','事业强者','嘴硬心重'],good:'能力强、责任重，细密地照顾现实生活，遇事肯承担。',risk:'用刻薄和命令包裹关心，做尽亲密之事却回避关系确认。',day:'接送、衣物、行程和难题，他常在你开口前便处理好。私下也严厉，偶尔让步很笨拙；那些伤人的话不能因为他做了很多事就被免除。',need:'他难以承认自己需要陪伴。你可以欣赏行动，也仍有权要求清楚的关系与尊重。',quote:'给你自己也拿件大衣。',original:true,scene:'生活里总有人替你兜底，车与衣物都已安排妥当；但问起关系，他常回到沉默和现实理由。',v:[2,0,3,1,0,0,3,0,0,0,1,1],fidelity:'exclusive',control:2},
{id:'li',name:'李俭',age:'37 岁',job:'公司最高管理层之一',type:'多情纠葛',tags:['极度英俊','漂亮的玩笑','未完的旧情'],good:'英俊风趣、浪漫多情，善于发现并回应你的魅力。',risk:'心动可以给你，完整归属却仍牵在另一段恋情里。',day:'他将调情说得自然，生活有细致的审美，也会用半真半假的玩笑藏住感受。你靠近时，他仍身处一段已有的长期恋情。',need:'风流与真情同时存在。这段故事不保证他会结束旧关系，也不把让你心动等同于对你作出承诺。',quote:'玩笑说得太认真，你是不是就不信了？',scene:'对话总有恰到好处的暧昧，真心藏在漂亮玩笑之后；他却仍牵挂另一段没有结束的恋情。',v:[3,3,1,2,2,3,2,3,3,1,1,3],fidelity:'existing',control:0},
{id:'wei',name:'卫腴臣',age:'25 岁',job:'时代中的理想主义青年',type:'共同生活',tags:['青梅竹马','顾家','认真守约'],good:'真诚顾家、长久可靠，认定你便把难处当成两个人的事。',risk:'太相信原则与忍耐，容易低估你已经承受不住的苦。',day:'从共同长大的熟悉走进成年相爱，他会守着病人、处理家事，把你的困难当作我们的事情。认真、能吃苦，也有执拗与自己的原则。',need:'他需要被当作自己人，重要决定一起商量；长期相处也要让不同的承受能力有位置。',quote:'疼痛是暂时的，而让我守着你这件事，是长久的。',original:true,scene:'与熟悉彼此成长的人一起过日子，做饭、等门、面对难处；昨天的约定，明天仍然算数。',v:[2,1,3,1,1,0,1,0,0,1,3,0],fidelity:'exclusive',control:1},
{id:'lin',name:'林苇安',age:'36 岁',job:'文学编辑 · 曾任贝斯手',type:'毒舌偏宠',tags:['爱世界也偏爱你','独立','丁克'],good:'聪明善良、忠诚偏宠，既给你自由，也愿意为你多绕一段路。',risk:'毒舌与高标准会伤人，深厚的亲友关系也让偏爱不总是一目了然。',day:'他会主动照顾，也会给每个人带东西，偏偏给你多一份。嘴毒、工作认真，私下很愿意迁就，却有自己的朋友、原则和十一点半的睡觉时间。',need:'他能说爱，难的是承认偏爱。亲友之爱不等于不忠；喜欢孩子但选择丁克，不靠恋人改变。',quote:'你烦不烦啊？……地址发我。',original:true,scene:'白天各自做事，回来分享书与见闻；他嘴毒却偏宠你，也依然珍惜朋友和自己的独处。',v:[2,3,3,3,1,3,2,3,1,2,1,2],fidelity:'exclusive',control:0,dink:true},
{id:'chen',name:'陈辞修',age:'35 岁',job:'成熟阶段的职业军人',type:'克己长情',tags:['沉静','责任','共同未来'],good:'冷静担当、主动长情，能够跨越分别守住共同未来。',risk:'对责任太忠诚，总把自己放在最后，让爱他的人长期担忧。',day:'他有独立判断与真实担当，也会主动写信、寻找见面的机会。成熟后的克制掩不住长情，他需要知道漫长分别之后，未来仍有彼此。',need:'理解他的责任，不等于赞美他无限透支身体。亲密关系里，他也需要学习把自己算进被照顾的人。',quote:'可有转圜余地？',original:true,scene:'各自承担责任，相隔很远也认真通信；不是时时在场，而是一直把重逢与共同未来放在心上。',v:[2,1,2,2,0,1,3,0,1,0,0,1],fidelity:'exclusive',control:1},
{id:'gao',name:'高志忱',age:'27 岁',job:'年轻连长 · 高干子弟',type:'暴烈依赖',tags:['护短','主动','怕离散'],good:'主动护短、有能力也有真心，信任你后愿意交出脆弱。',risk:'害怕离散，容易用怒气和控制阻止你改变原来的生活。',day:'他自负、行动快，也真正记得自己负责的人。家庭资源与证明压力同时存在；脸上的救援伤疤属于他的经历，却不应成为不顾身体的理由。',need:'他能接受任务造成的距离，更怕关系突然消失。信任你以后会求你帮忙拿主意，但需要学会接受变化。',quote:'我俩一直待在一起好吗，我是说一直一直。',original:true,scene:'一个主动护短的人把你放进未来，嘴上仍很强硬；真正信任时，却会承认难过、求你帮忙拿主意。',v:[3,2,2,0,3,0,3,1,3,3,2,2],fidelity:'exclusive',control:2},

let answers=[],orders=[],step=0,shortlist=[],winner=null,viewed=null,finalChoice=null;
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(html){app.innerHTML=html;window.scrollTo(0,0);let h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function start(){answers=Array(15).fill(null);orders=questions.map(()=>shuffled([0,1,2,3]));step=0;winner=null;finalChoice=null;quiz()}
function eligible(p,a){if(p.extreme&&a[13]!==3)return false;if(a[12]===0&&p.fidelity!=='exclusive')return false;if(a[12]===1&&p.fidelity!=='exclusive')return false;if(a[12]===2&&p.fidelity==='open')return false;if(a[13]===0&&p.control>0)return false;if(a[13]===1&&p.control>1)return false;if(a[13]===2&&p.control>2)return false;if(a[14]===0&&p.child)return false;if(a[14]===1&&p.dink)return false;return true}
function rank(a){return people.filter(p=>eligible(p,a)).map(p=>({p,score:p.v.reduce((s,v,i)=>s+(v-a[i])**2,0)})).sort((a,b)=>a.score-b.score||a.p.id.localeCompare(b.p.id))}
function quiz(){let last=step===15;if(last)shortlist=rank(answers).slice(0,3);let q=last?['最后，哪一段相处最让你愿意走近？',shortlist.map(x=>x.p.scene)]:questions[step],seq=last?q[1].map((_,i)=>i):orders[step],sel=last?finalChoice:answers[step];show(`<section class="quiz"><div class="qtop"><button class="linkbtn" onclick="back()">← ${step?'上一题':'返回首页'}</button><span class="meta">${String(step+1).padStart(2,'0')} / 16</span></div><div class="progress" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="16" aria-valuenow="${step}"><span style="width:${step/16*100}%"></span></div><div class="chapter">${step<6?'第一章 · 心动的形状':step<12?'第二章 · 相处的温度':last?'终章 · 写下那个名字':'第三章 · 你的关系选择'}</div><h2>${q[0]}</h2><p class="qnote">${last?'根据前面的回答，留下了这些相处可能。':'以自己的身份回答，选最接近你心意的一项。'}</p><div class="options" role="group" aria-label="选择你的回答">${seq.map((v,i)=>`<button class="option" data-value="${v}" aria-pressed="${sel===v}" onclick="choose(${v})"><span class="letter">${'ABCD'[i]}</span><span>${q[1][v]}</span></button>`).join('')}</div><div class="qbottom"><span class="quiet">心动与难处，会写在同一张档案上。</span><button id="next" class="primary" onclick="next()" ${sel===null?'disabled':''}>${last?'揭晓我的恋人':'继续'} →</button></div></section>`)}
function choose(v){if(step===15)finalChoice=v;else{answers[step]=v;finalChoice=null}app.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.value)===v));document.getElementById('next').disabled=false}
function next(){if(step===15){if(finalChoice===null)return;winner=shortlist[finalChoice].p.id;result(winner)}else if(answers[step]!==null){step++;quiz()}}
function back(){if(step){step--;quiz()}else home()}
function result(id){viewed=id;let p=people.find(p=>p.id===id),own=winner===id;let why=own?p.v.map((v,i)=>({i,d:Math.abs(v-answers[i])})).sort((a,b)=>a.d-b.d).slice(0,3).map(x=>`<li>${dims[x.i]}：你选择了“${questions[x.i][1][answers[x.i]]}”</li>`).join(''):'';show(`<section class="result"><div class="result-intro"><div class="eyebrow">${own?'你的恋人档案，已有署名':'十七位恋人 · 人物档案'}</div><h2>${own?'你最想走近的，是这样的他。':'每种吸引，都有另一面。'}</h2><p class="quiet">原创角色娱乐匹配，不代表现实中的命定伴侣。</p></div><div class="result-grid"><aside class="identity"><span class="meta">LOVER FILE / ${String(people.indexOf(p)+1).padStart(2,'0')}</span><div class="monogram">${p.id==='joey'?'J':p.name[0]}</div><h2>${p.name}</h2><div class="role">${p.age}<br>${p.job}</div><div class="type">${p.type}型恋人</div><div class="identity-foot">Affection, with all its contradictions.</div></aside><article class="result-content"><section class="result-section"><h3>恋爱优点</h3><p>${p.good}</p><div class="chips" style="margin-top:17px">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></section><section class="result-section danger"><h3>危险恋人</h3><p>${p.risk}</p></section><section class="result-section"><h3>与你相处时</h3><p>${p.day}</p></section><section class="result-section"><h3>这段关系需要看见</h3><p>${p.need}</p></section>${own?`<section class="result-section"><h3>你的答案为什么靠近他</h3><ul class="reasons">${why}</ul><p class="quiet">最后一题由你选择了他的相处场景。</p></section>`:''}<section class="result-section"><p class="linequote">“${p.quote}”</p><p class="quote-note">${p.original?'角色代表台词':'依据角色设定创作的相处短句'}</p></section></article></div>${p.extreme?'<p class="notice">喜欢危险的虚构角色，不代表同意在现实关系中被强迫或利用。</p>':''}<div class="actions"><button class="primary" onclick="saveCard()">保存恋人卡 ↓</button><button class="secondary" onclick="start()">重新测试</button><button class="secondary" onclick="atlas()">查看 17 人档案</button>${!own&&winner?'<button class="secondary" onclick="result(winner)">我的结果</button>':''}</div><p id="save-status" class="quiet" role="status"></p><div id="export-holder"></div></section>`)}
function atlas(){show(`<section><button class="linkbtn" onclick="${winner?'result(winner)':'home()'}">← 返回</button><div class="eyebrow">THE SEVENTEEN</div><h2>十七种心动，各有缺口。</h2><div class="atlas">${people.map((p,i)=>`<button onclick="result('${p.id}')"><span class="meta">${String(i+1).padStart(2,'0')} / ${p.age}</span><h3>${p.name}</h3><p>${p.type}</p><p style="margin-top:13px">${p.good}</p></button>`).join('')}</div></section>`)}
function saveCard(){let p=people.find(p=>p.id===viewed),c=document.createElement('canvas');c.width=1000;c.height=1600;let x=c.getContext('2d');x.fillStyle='#f5f0e8';x.fillRect(0,0,1000,1600);x.fillStyle='#461526';x.fillRect(0,0,1000,440);let y=80;function write(t,size,color='#341c25',weight='normal'){x.font=`${weight} ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;x.fillStyle=color;let row='';for(let ch of t){if(x.measureText(row+ch).width>840){x.fillText(row,80,y);y+=size*1.6;row=ch}else row+=ch}x.fillText(row,80,y);y+=size*1.6}write('恋人未署名 / LOVER FILE '+String(people.indexOf(p)+1).padStart(2,'0'),23,'#d5b9bc');y+=30;write(p.name,65,'#f3e8da','bold');write(p.type+'型恋人',33,'#e0bbbd');write(p.age+' · '+p.job,23,'#d5b9bc');y=520;write('恋爱优点',33,'#631e37','bold');write(p.good,30);y+=30;write('危险恋人',33,'#912f43','bold');write(p.risk,30);y+=35;write('相处日常',30,'#631e37','bold');write(p.day,27);y+=30;write('“'+p.quote+'”',32,'#631e37');write(p.original?'角色代表台词':'依据角色设定创作',20,'#786670');y=1490;write('原创角色娱乐测试 · 心动不等于现实适配',23,'#786670');let url=c.toDataURL('image/png'),a=document.createElement('a');a.href=url;a.download=p.name+'-恋人档案.png';a.click();document.getElementById('save-status').textContent='图片已生成。手机若未自动下载，可长按下方卡片保存。';document.getElementById('export-holder').innerHTML=`<img class="export-preview" src="${url}" alt="${p.name}的恋人卡">`}

home();
