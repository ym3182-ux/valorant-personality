<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141b"><meta name="description" content="8 道车队名场面，测测你是哪位打瓦神人。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%23ff4c5c%27/%3E%3Cpath d=%27M6 8l10 18L26 8h-6l-4 8-4-8z%27 fill=%27%2310141b%27/%3E%3C/svg%3E"><title>测测你的打瓦人格 · 五排档案</title><style>
:root{color-scheme:dark;--bg:#10141b;--paper:#eeeae1;--red:#ff4c5c;--muted:#9b9fa8;--line:#ffffff21}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:5px}button:disabled{opacity:.35;cursor:default}header{height:88px;max-width:1320px;margin:auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:2px;display:flex;gap:13px;align-items:center}.logo{background:var(--red);color:var(--bg);font-size:23px;padding:5px 9px;transform:skew(-8deg)}.micro{font-family:monospace;font-size:12px;letter-spacing:2px;color:var(--muted)}.edition{font-size:13px;color:var(--muted)}main{max-width:1240px;margin:auto;padding:64px 32px 40px;min-height:calc(100vh - 155px)}.home{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:center;min-height:550px}.eyebrow{display:flex;gap:12px;align-items:center;color:var(--red);font-size:14px;letter-spacing:2px}.eyebrow:before{content:'';width:26px;height:2px;background:currentColor}h1{font-size:clamp(44px,6.3vw,80px);line-height:1.13;letter-spacing:-3px;margin:28px 0;font-weight:950}h1 em{font-style:normal;color:var(--red)}.intro{color:#b8bbc2;line-height:1.9;margin:24px 0 32px}.primary{border:1px solid var(--red);background:var(--red);color:#11151c;padding:19px 27px;font-weight:800;min-width:210px;display:inline-flex;justify-content:space-between;gap:36px;transition:.2s}.primary:hover{background:#ff7180;transform:translateY(-2px)}.smallmeta{margin-top:22px;display:flex;gap:22px;font-size:13px;color:var(--muted)}.dossier{position:relative;border:1px solid #ffffff33;background:#191e27;transform:rotate(2deg);padding:26px;box-shadow:12px 14px 0 #070b11}.dossier:before{content:'';position:absolute;width:70px;height:8px;background:var(--red);top:-4px;right:25px}.dossier-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.dossier-title{font-size:22px;font-weight:800}.classified{color:var(--red);border:1px solid;padding:5px 8px;font-size:12px;transform:rotate(-7deg)}.slot{display:flex;align-items:center;gap:17px;padding:20px 0;border-bottom:1px solid var(--line)}.slot:last-of-type{border-bottom:0}.number{font:24px monospace;color:#656b79}.slot b{font-size:18px}.slot p{font-size:13px;color:var(--muted);margin:7px 0 0}.slot .mark{margin-left:auto;font:25px monospace;color:var(--red)}.dossier-foot{font:12px monospace;letter-spacing:3px;margin-top:20px;color:#888e9b}.foot{max-width:1240px;margin:0 auto;padding:24px 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#858a94;font-size:12px}.quiz{max-width:820px;margin:auto}.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.textbtn{color:#b9bdc5;background:none;border:0;padding:10px 0}.track{height:3px;background:#30353f;margin-bottom:46px}.fill{height:100%;background:var(--red);transition:width .3s}.qnumber{color:var(--red);font:14px monospace;letter-spacing:3px}h2{font-size:clamp(26px,4vw,38px);line-height:1.5;margin:16px 0 28px;letter-spacing:-1px}.options{display:grid;gap:12px}.option{width:100%;display:flex;text-align:left;align-items:center;gap:20px;background:#1a1f28;border:1px solid #ffffff18;color:var(--paper);padding:18px 22px;line-height:1.6;transition:.16s}.option:hover{border-color:#a8abb5;background:#242b35}.option[aria-pressed=true]{background:#ff4c5c15;border-color:var(--red)}.letter{font:14px monospace;color:#9399a6;border:1px solid #ffffff30;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}.option[aria-pressed=true] .letter{background:var(--red);color:#10141b;border-color:var(--red)}.quiz-bottom{display:flex;justify-content:space-between;align-items:center;margin:26px 0;gap:20px}.hint{color:var(--muted);font-size:13px}.result{max-width:920px;margin:auto}.resultcard{background:var(--paper);color:#161c26;padding:42px;position:relative;border-top:8px solid var(--accent,var(--red))}.result-head{display:flex;justify-content:space-between;gap:20px}.result-head .micro{color:#606671}.resultname{font-size:clamp(27px,5vw,46px);font-weight:900;margin:27px 0 10px;overflow-wrap:anywhere}.archetype{font-size:22px;color:var(--accent);font-weight:800}.quote{font-size:clamp(24px,4vw,35px);font-weight:900;border-top:1px solid #151a2530;padding-top:24px;margin:28px 0 18px}.description{font-size:16px;line-height:1.95;color:#4f5560;max-width:740px}.tags{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.tag{border:1px solid #151a2540;padding:7px 12px;font-size:13px}.instruction{background:#151a2509;padding:18px;line-height:1.7;margin-top:22px}.result-actions{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap}.secondary{padding:16px 23px;border:1px solid #ffffff40;background:transparent;color:var(--paper)}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.gallery button{background:#1a1f28;color:var(--paper);border:1px solid #ffffff25;text-align:left;padding:22px;line-height:1.8}.gallery b{display:block;font-size:18px}.gallery span{font-size:14px;color:var(--muted)}.fade{animation:arrive .3s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){header{height:70px;padding:0 22px}.edition{font-size:12px}.home{grid-template-columns:1fr;gap:48px;min-height:auto}main{padding:36px 22px}.home h1{font-size:54px}.dossier{margin:0 8px 24px;padding:22px;transform:rotate(1deg)}.intro{font-size:15px}.foot{padding:20px 22px;gap:20px;line-height:1.7}.foot .micro{display:none}.resultcard{padding:25px 22px}.result-head{flex-direction:column;gap:8px}.quiz-bottom{align-items:flex-start;flex-direction:column}.quiz-bottom .primary{width:100%}.option{padding:15px;gap:14px}.track{margin-bottom:30px}.gallery{grid-template-columns:1fr}.smallmeta{gap:15px}.brand{letter-spacing:1px}.hint{line-height:1.6}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand"><span class="logo">V</span> 五排人格档案</div><span class="edition">车队内部特别版 / VOL. 01</span></header><main id="app"></main><footer class="foot"><span>本测试由车队名场面编制，仅供开黑认亲。</span><span class="micro">FIVE PLAYERS. FIVE PERSONALITIES.</span></footer><script>
const people=[
{name:'汉中俊林玩具批发',title:'不被理解的战术宗师',lead:'你负责杀三个，也负责听剩下的人讲道理。',quote:'又骂我啊？',heroes:'炼狱',tags:['道具大师','战术核心','委屈输出'],color:'#b44622',desc:'你的脑子里有完整的战术，手里有精确到时机的道具。炼狱防拆包、雷兹炸弹，每一招都有自己的讲究。理想中的比赛是队友听指挥、一起执行；现实是你杀完三个回头一看，大家各打各的，还顺便问你在干什么。你不一定说得最多，但说的话最好有人听。',tip:'请在他开始操作前听指挥，不要在他操作完后教他操作。'},
{name:'豆本豆豆奶',title:'被迫上岗的全能大哥',lead:'本来想当最强道具位，结果还得兼职全队火力。',quote:'这把我强图嘿嘿',heroes:'斯凯、芮娜',tags:['钢枪猛女','全能补位','被迫带队'],color:'#267455',desc:'你会指挥、会给道具，也能直接拿枪解决问题。别人觉得队里有你很安心，你看着战绩却开始思考：为什么支援、突破和杀人都得我来？“这把我强图嘿嘿”是你的开场白；杀了三十几个人之后，语气就不一定这么轻松了。',tip:'她能当大哥，不代表其他四个人可以集体放假。'},
{name:'天然呆美少年',title:'战场气氛总导演',lead:'绕后靠直觉，架枪靠耐心，开麦靠情绪。',quote:'蝰蛇你老公我来了',heroes:'尚博勒、维斯',tags:['直觉绕后','整活担当','极速红温'],color:'#7454aa',desc:'你可以安静地架住一个角落，也可以突然决定去对面后排制造惊喜。比走位更难预测的是你的情绪：上一秒还在整活，下一秒已经进入对线环节。你的存在保证了队伍永远有节目。即使自己的麦暂时不能用了，节目也可能从豆本豆豆奶的麦里继续播出。',tip:'建议安排一位情绪稳定的队友陪同开黑。'},
{name:'小则又沐风',title:'从容不迫的冲锋选手',lead:'冲锋的心已经到了，道具还在路上。',quote:'等等我下个烟',heroes:'捷风、钢索',tags:['乐观冲锋','稳定心态','慢工出道具'],color:'#226d8a',desc:'你愿意跟着大家往前冲，也愿意认真把每一步准备做好。队友越着急，你越显得从容：别急，先把这个烟下了。等你准备完毕，前线可能已经打扫完战场。但没关系，下一回合你依然乐观，依然愿意跟上大家。这支队伍需要一点稳定的情绪，而你刚好很多。',tip:'请提前通知进攻时间，给她留出充分的施法准备。'},
{name:'情郎qwq',title:'热心误伤型先锋',lead:'报点是给队友的，闪光有时也是。',quote:'你算啥子',heroes:'不死鸟、钢索',tags:['积极报点','多面打法','道具待驯服'],color:'#b3394b',desc:'你愿意冲、愿意架，也愿意绕后配合。哪里需要人，你就想过去帮一把。你的团队意识很积极，只是道具偶尔有自己的想法。你想用闪光给队友创造机会，队友却先体验了一次白屏；你想用墙切割战场，队友发现自己也被切割在里面了。心意到了，落点还需要再练练。',tip:'听到“我帮你”时，请同时关注敌人和友方道具。'}];
const questions=[
['准备进点了，你通常在干什么？',['先把道具和时机安排好，希望大家按计划执行。','给完道具就拉出去打，没人突破我来突破。','感觉侧面有机会，我去绕一下。','跟着大部队，但等等，我还要下个烟。','先报点再给队友一个闪，落点嘛……尽力了。']],
['你已经杀了三个，这回合还是输了。你的第一反应？',['“刚刚不是说好一起打的吗？”','“这都赢不了，真得我全杀吗？”','血压上来了，得当场把事情讲明白。','“没事没事，下把一起。”','本来还在认真报点，被质疑之后立刻回嘴。']],
['你心目中最完美的一次道具发挥是？',['卡准时机，靠道具阻止拆包拿下回合。','道具帮队友创造机会，我再把剩下的人收掉。','给我的奇妙绕后创造一个机会。','安全稳妥地放好，让大家舒服进点。','队友顺利接住我的配合，而且没有喊“你闪到我了”。']],
['队友一直不听你的建议，你会？',['再报一次关键信息，然后自己把该做的做好。','直接打出突破，让他们跟上。','行，那我按直觉玩了。','跟着大家走，别脱节就好。','继续提醒位置，但别一边不听一边怪我。']],
['以下哪种名场面最可能发生在你身上？',['打出了漂亮操作，最后还是莫名其妙挨了骂。','战绩遥遥领先，开始怀疑自己的队伍。','打枪之外，还贡献了一整场语音节目。','刚把准备工作做完，队友已经结束战斗。','很认真地帮了忙，队友却集体惨叫。']],
['打一个关键回合，你最信任什么？',['提前想好的战术和道具时机。','自己的枪，以及把局面打回来的能力。','“我感觉这样能行。”','大家的行动，跟紧队友就好。','及时的信息和主动配合，沟通不能停。']],
['如果队友吐槽你，你最可能怎么接？',['“怎么又是我？”','“先看看这把是谁在杀。”','立刻接话，绝不让语音冷场。','笑一下，下回合继续跟他们打。','直接怼回去，但该报的点还是照报。']],
['你最希望队友对你说哪句话？',['“这把听你的，你说怎么打。”','“这把我们能杀，你不用一个人扛。”','“你放心整，这边我们看着。”','“不急，等你道具好了再进。”','“好闪！这次配合太舒服了！”']]];
let answers=[],orders=[],step=0,winner=null,shown=null;const app=document.getElementById('app');
function setView(html){app.innerHTML=html;app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');window.scrollTo(0,0);const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
function home(){setView(`<section class="home"><div><div class="eyebrow">你的车队人格，等待归位</div><h1>测测你的<br><em>打瓦人格。</em></h1><p class="intro">有人用道具改变战局，<br>有人用道具改变队友的心情。<br>你，是车队里的哪位神人？</p><button class="primary" onclick="start()">开始测试 <span>↗</span></button><div class="smallmeta"><span>08 道名场面</span><span>05 种人格</span><span>约 2 分钟</span></div></div><aside class="dossier"><div class="dossier-head"><div class="dossier-title">五排机密档案</div><span class="classified">尚未解锁</span></div>${['战术有人安排，委屈自己消化','道具位打着打着成了大哥','比赛可以输，语音不能冷场','等我下个烟……人呢？','出发点很好，闪到的是队友'].map((s,i)=>`<div class="slot"><span class="number">0${i+1}</span><div><b>未确认人格</b><p>${s}</p></div><span class="mark">?</span></div>`).join('')}<div class="dossier-foot">SQUAD ARCHIVE / WHO ARE YOU?</div></aside></section>`)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){answers=Array(8).fill(null);orders=questions.map(()=>shuffle([0,1,2,3,4]));step=0;winner=null;quiz()}
function quiz(){const q=questions[step];setView(`<section class="quiz"><div class="quiz-top"><button class="textbtn" onclick="back()">← ${step?'上一题':'返回首页'}</button><span class="micro">${String(step+1).padStart(2,'0')} / 08</span></div><div class="track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${step}"><div class="fill" style="width:${step/8*100}%"></div></div><div class="qnumber">ROUND ${String(step+1).padStart(2,'0')}</div><h2>${q[0]}</h2><div class="options" role="group" aria-label="选择最像你的反应">${orders[step].map((person,i)=>`<button class="option" data-person="${person}" aria-pressed="${answers[step]===person}" onclick="select(${person})"><span class="letter">${'ABCDE'[i]}</span><span>${q[1][person]}</span></button>`).join('')}</div><div class="quiz-bottom"><span class="hint">没有标准答案，选最像你的那个。</span><button id="next" class="primary" ${answers[step]===null?'disabled':''} onclick="next()">${step===7?'揭晓我的人格':'下一题'} <span>→</span></button></div></section>`)}
function select(p){answers[step]=p;app.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.person)===p));document.getElementById('next').disabled=false}
function back(){if(step){step--;quiz()}else home()}
function getWinner(a){const scores=[0,0,0,0,0];a.forEach(p=>scores[p]++);const max=Math.max(...scores);const tied=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);return [0,5,7,1,2,3,4,6].map(i=>a[i]).find(p=>tied.includes(p))}
function next(){if(answers[step]===null)return;if(step<7){step++;quiz()}else{winner=getWinner(answers);result(winner)}}
function result(i){shown=i;const p=people[i];setView(`<section class="result"><div class="eyebrow" style="margin-bottom:22px">${i===winner?'人格匹配完成 / 这就是你':'五排人格图鉴'}</div><article class="resultcard" style="--accent:${p.color}"><div class="result-head"><span class="micro">PLAYER DOSSIER / 0${i+1}</span><span class="micro">代表英雄 · ${p.heroes}</span></div><h2 class="resultname">${p.name}</h2><div class="archetype">${p.title}</div><div class="quote">“${p.quote}”</div><b>${p.lead}</b><p class="description">${p.desc}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="instruction"><b>车队使用说明</b><br>${p.tip}</div></article><div class="result-actions"><button class="primary" onclick="saveCard()">保存人格卡 ↓</button><button class="secondary" onclick="start()">不服，再测一次</button><button class="secondary" onclick="gallery()">查看人格图鉴</button>${i!==winner?'<button class="secondary" onclick="result(winner)">返回我的结果</button>':''}</div><p class="hint" id="save-status" role="status"></p></section>`)}
function gallery(){setView(`<section class="result"><button class="textbtn" onclick="result(winner)">← 返回我的结果</button><div class="eyebrow" style="margin-top:22px">全员档案已解锁</div><h2>车队里，一个都不能少。</h2><div class="gallery">${people.map((p,i)=>`<button onclick="result(${i})" style="border-top:3px solid ${p.color}"><span>FILE 0${i+1}${i===winner?' · 你的匹配':''}</span><b>${p.name}</b><span>${p.title}</span></button>`).join('')}</div></section>`)}
function saveCard(){const p=people[shown],c=document.createElement('canvas');c.width=1080;c.height=1500;const x=c.getContext('2d');x.fillStyle='#eeeae1';x.fillRect(0,0,1080,1500);x.fillStyle=p.color;x.fillRect(0,0,1080,18);let y=110;function line(text,size,color='#161c26',weight='normal',max=920){x.font=`${weight} ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;x.fillStyle=color;let row='';for(const ch of text){if(x.measureText(row+ch).width>max){x.fillText(row,80,y);y+=size*1.65;row=ch}else row+=ch}if(row){x.fillText(row,80,y);y+=size*1.65}}
line('五排人格档案 / PLAYER 0'+(shown+1),25,'#656b75');y+=35;line(p.name,58,'#161c26','bold');line(p.title,35,p.color,'bold');y+=35;line('“'+p.quote+'”',46,'#161c26','bold');y+=15;line(p.lead,29,'#161c26','bold');y+=20;line(p.desc,28,'#535965');y+=20;line(p.tags.join(' / '),27,p.color,'bold');line('代表英雄：'+p.heroes,26);y+=25;line('车队使用说明',27,'#161c26','bold');line(p.tip,27,'#535965');y=Math.max(y+45,1390);line('测测你的打瓦人格 · 仅供开黑认亲',24,'#656b75');c.toBlob(blob=>{if(!blob){document.getElementById('save-status').textContent='图片生成失败，请尝试截图保存。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=p.name+'-打瓦人格.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('save-status').textContent='人格卡已生成。如果手机未自动下载，可直接截图保存。'},'image/png')}
home();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'complete_personality_quiz',description:'根据用户选择的八个答案完成人格测试并展示结果。每个答案为对应人物倾向的索引 0 至 4。',inputSchema:{type:'object',properties:{answers:{type:'array',items:{type:'integer',minimum:0,maximum:4},minItems:8,maxItems:8}},required:['answers'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!Array.isArray(input.answers)||input.answers.length!==8||input.answers.some(n=>!Number.isInteger(n)||n<0||n>4))throw new Error('需要八个有效答案');answers=[...input.answers];winner=getWinner(answers);result(winner);return {name:people[winner].name,title:people[winner].title}}})).catch(()=>{})}catch{}}
</script></body></html>
